<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Test - Simple</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .test { background: white; padding: 20px; margin: 10px 0; border-radius: 8px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        input { width: 200px; padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🧪 Backend Connection Test</h1>
    
    <div class="test">
        <h2>1. Basic Connection Test</h2>
        <button onclick="testConnection()">Test Backend Connection</button>
        <div id="connectionResult"></div>
    </div>

    <div class="test">
        <h2>2. Health Check</h2>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <div id="healthResult"></div>
    </div>

    <div class="test">
        <h2>3. Login Test</h2>
        <input type="email" id="email" placeholder="Email" value="coordinator@university.edu"><br>
        <input type="password" id="password" placeholder="Password" value="password123"><br>
        <button onclick="testLogin()">Test Login</button>
        <div id="loginResult"></div>
    </div>

    <div class="test">
        <h2>4. Events Test</h2>
        <button onclick="testEvents()">Test Get Events</button>
        <div id="eventsResult"></div>
    </div>

    <div class="test">
        <h2>5. Clubs Test</h2>
        <button onclick="testClubs()">Test Get Clubs</button>
        <div id="clubsResult"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3002';

        function showResult(elementId, message, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.innerHTML = message;
            element.className = 'result ' + (isSuccess ? 'success' : 'error');
        }

        async function testConnection() {
            try {
                showResult('connectionResult', '🔄 Testing connection...', true);
                
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    showResult('connectionResult', `✅ Connection successful!<br>Message: ${data.message}<br>Time: ${data.timestamp}`, true);
                } else {
                    showResult('connectionResult', `❌ Connection failed: ${response.status}`, false);
                }
            } catch (error) {
                showResult('connectionResult', `❌ Network error: ${error.message}<br><br>Make sure:<br>1. Backend is running on port 3002<br>2. No firewall blocking the connection`, false);
            }
        }

        async function testHealth() {
            try {
                showResult('healthResult', '🔄 Testing health endpoint...', true);
                
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                
                showResult('healthResult', `✅ Health check passed!<br>Environment: ${data.environment}<br>Status: ${data.success}`, true);
            } catch (error) {
                showResult('healthResult', `❌ Health check failed: ${error.message}`, false);
            }
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                showResult('loginResult', '🔄 Testing login...', true);
                
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showResult('loginResult', `✅ Login successful!<br>User: ${data.data.user.name}<br>Role: ${data.data.user.role}<br>Token: ${data.data.session.access_token.substring(0, 20)}...`, true);
                    window.authToken = data.data.session.access_token;
                } else {
                    showResult('loginResult', `❌ Login failed: ${data.message}`, false);
                }
            } catch (error) {
                showResult('loginResult', `❌ Login error: ${error.message}`, false);
            }
        }

        async function testEvents() {
            try {
                showResult('eventsResult', '🔄 Testing events endpoint...', true);
                
                const response = await fetch(`${API_BASE_URL}/api/events`);
                const data = await response.json();
                
                if (response.ok && data.success) {
                    const events = data.data.events;
                    let eventsList = events.map(event => 
                        `• ${event.title} (${event.status}) - ${new Date(event.date).toLocaleDateString()}`
                    ).join('<br>');
                    
                    showResult('eventsResult', `✅ Events loaded successfully!<br>Found ${events.length} events:<br><br>${eventsList}`, true);
                } else {
                    showResult('eventsResult', `❌ Events failed: ${data.message}`, false);
                }
            } catch (error) {
                showResult('eventsResult', `❌ Events error: ${error.message}`, false);
            }
        }

        async function testClubs() {
            try {
                showResult('clubsResult', '🔄 Testing clubs endpoint...', true);
                
                const response = await fetch(`${API_BASE_URL}/api/clubs`);
                const data = await response.json();
                
                if (response.ok && data.success) {
                    const clubs = data.data.clubs;
                    let clubsList = clubs.map(club => 
                        `• ${club.name} - ${club.description || 'No description'}`
                    ).join('<br>');
                    
                    showResult('clubsResult', `✅ Clubs loaded successfully!<br>Found ${clubs.length} clubs:<br><br>${clubsList}`, true);
                } else {
                    showResult('clubsResult', `❌ Clubs failed: ${data.message}`, false);
                }
            } catch (error) {
                showResult('clubsResult', `❌ Clubs error: ${error.message}`, false);
            }
        }

        // Auto-test connection on page load
        window.addEventListener('load', () => {
            setTimeout(testConnection, 500);
        });
    </script>
</body>
</html>
