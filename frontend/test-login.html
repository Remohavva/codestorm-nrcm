<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .success { background: #065f46; }
        .error { background: #7f1d1d; }
        .info { background: #1e3a8a; }
        .button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .button:hover {
            background: #2563eb;
        }
        .form-group {
            margin: 15px 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #374151;
            border: 1px solid #6b7280;
            border-radius: 5px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Login System Test</h1>
        
        <div class="status info">
            <h3>Test Login System</h3>
            <p>This page tests the login functionality directly with the backend API.</p>
        </div>

        <div class="status" id="backend-status">
            <h3>Backend Status:</h3>
            <p id="backend-message">Testing...</p>
        </div>

        <div style="background: #1f2937; padding: 20px; border-radius: 8px; margin: 20px 0;">
            <h3>Create Test Coordinator</h3>
            <p>First, create a test coordinator user in the database:</p>
            <button class="button" onclick="createTestUser()">Create Test Coordinator</button>
            <div id="create-user-result"></div>
        </div>

        <div style="background: #1f2937; padding: 20px; border-radius: 8px; margin: 20px 0;">
            <h3>Test Login</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" value="coordinator@university.edu" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="password" value="password123" required>
                </div>
                <button type="submit" class="button">Test Login</button>
            </form>
            <div id="login-result"></div>
        </div>

        <div style="background: #1f2937; padding: 20px; border-radius: 8px; margin: 20px 0;">
            <h3>Quick Links</h3>
            <button class="button" onclick="window.open('http://localhost:5174/login/coordinator', '_blank')">
                Open Coordinator Login
            </button>
            <button class="button" onclick="window.open('http://localhost:5174/coordinator/dashboard', '_blank')">
                Open Dashboard (Direct)
            </button>
        </div>
    </div>

    <script>
        // Test backend health
        fetch('http://localhost:3002/health')
            .then(response => {
                if (response.ok) {
                    document.getElementById('backend-status').className = 'status success';
                    document.getElementById('backend-message').textContent = '✅ Backend is running on port 3002';
                } else {
                    document.getElementById('backend-status').className = 'status error';
                    document.getElementById('backend-message').textContent = '❌ Backend health check failed';
                }
            })
            .catch(error => {
                document.getElementById('backend-status').className = 'status error';
                document.getElementById('backend-message').textContent = '❌ Cannot reach backend: ' + error.message;
            });

        // Create test user
        async function createTestUser() {
            const result = document.getElementById('create-user-result');
            result.innerHTML = '<p>Creating test coordinator...</p>';

            try {
                const response = await fetch('http://localhost:3002/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: 'John Coordinator',
                        email: 'coordinator@university.edu',
                        role: 'club_lead'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = '<p style="color: #10b981;">✅ Test coordinator created successfully!</p>';
                } else {
                    result.innerHTML = '<p style="color: #f59e0b;">⚠️ ' + data.message + '</p>';
                }
            } catch (error) {
                result.innerHTML = '<p style="color: #ef4444;">❌ Error: ' + error.message + '</p>';
            }
        }

        // Test login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('login-result');
            
            result.innerHTML = '<p>Testing login...</p>';

            try {
                const response = await fetch('http://localhost:3002/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `
                        <div style="color: #10b981;">
                            <p>✅ Login successful!</p>
                            <p><strong>User:</strong> ${data.data.user.name}</p>
                            <p><strong>Role:</strong> ${data.data.user.role}</p>
                            <p><strong>Token:</strong> ${data.data.session.access_token.substring(0, 20)}...</p>
                        </div>
                    `;
                    
                    // Store token for testing
                    localStorage.setItem('token', data.data.session.access_token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    
                } else {
                    result.innerHTML = '<p style="color: #ef4444;">❌ Login failed: ' + data.message + '</p>';
                }
            } catch (error) {
                result.innerHTML = '<p style="color: #ef4444;">❌ Error: ' + error.message + '</p>';
            }
        });
    </script>
</body>
</html>
