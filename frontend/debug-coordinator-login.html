<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Coordinator Login</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .step {
            background: #1f2937;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
        }
        .success { border-left-color: #10b981; }
        .error { border-left-color: #ef4444; }
        .warning { border-left-color: #f59e0b; }
        .button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .button:hover { background: #2563eb; }
        .button.success { background: #10b981; }
        .button.error { background: #ef4444; }
        .code {
            background: #374151;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug Coordinator Login Flow</h1>
        
        <div class="step">
            <h3>Step 1: Check Backend Health</h3>
            <button class="button" onclick="checkBackend()">Test Backend</button>
            <div id="backend-result"></div>
        </div>

        <div class="step">
            <h3>Step 2: Create Test Coordinator</h3>
            <button class="button" onclick="createCoordinator()">Create Coordinator User</button>
            <div id="coordinator-result"></div>
        </div>

        <div class="step">
            <h3>Step 3: Test Login API</h3>
            <button class="button" onclick="testLogin()">Test Login</button>
            <div id="login-result"></div>
        </div>

        <div class="step">
            <h3>Step 4: Test Coordinator API</h3>
            <button class="button" onclick="testCoordinatorAPI()">Test Dashboard API</button>
            <div id="api-result"></div>
        </div>

        <div class="step">
            <h3>Step 5: Test Frontend Login</h3>
            <button class="button" onclick="window.open('http://localhost:5174/login/coordinator', '_blank')">
                Open Coordinator Login
            </button>
            <p>Use credentials: <strong>coordinator@university.edu</strong> / <strong>password123</strong></p>
        </div>

        <div class="step">
            <h3>Debug Information</h3>
            <div id="debug-info">
                <p>Current localStorage:</p>
                <div class="code" id="storage-info"></div>
            </div>
        </div>
    </div>

    <script>
        let authToken = null;

        function updateStorageInfo() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            document.getElementById('storage-info').innerHTML = `
                Token: ${token ? token.substring(0, 30) + '...' : 'None'}<br>
                User: ${user || 'None'}
            `;
        }

        async function checkBackend() {
            const result = document.getElementById('backend-result');
            result.innerHTML = '<p>Checking backend...</p>';

            try {
                const response = await fetch('http://localhost:3002/health');
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `<p style="color: #10b981;">✅ Backend healthy: ${data.message}</p>`;
                } else {
                    result.innerHTML = `<p style="color: #ef4444;">❌ Backend error: ${response.status}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p style="color: #ef4444;">❌ Cannot reach backend: ${error.message}</p>`;
            }
        }

        async function createCoordinator() {
            const result = document.getElementById('coordinator-result');
            result.innerHTML = '<p>Creating coordinator user...</p>';

            try {
                const response = await fetch('http://localhost:3002/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'John Coordinator',
                        email: 'coordinator@university.edu',
                        role: 'club_lead'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `<p style="color: #10b981;">✅ Coordinator created: ${data.data.user.name} (${data.data.user.role})</p>`;
                } else {
                    result.innerHTML = `<p style="color: #f59e0b;">⚠️ ${data.message}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p style="color: #ef4444;">❌ Error: ${error.message}</p>`;
            }
        }

        async function testLogin() {
            const result = document.getElementById('login-result');
            result.innerHTML = '<p>Testing login...</p>';

            try {
                const response = await fetch('http://localhost:3002/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'coordinator@university.edu',
                        password: 'password123'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.data.session.access_token;
                    localStorage.setItem('token', authToken);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    
                    result.innerHTML = `
                        <div style="color: #10b981;">
                            <p>✅ Login successful!</p>
                            <p><strong>Name:</strong> ${data.data.user.name}</p>
                            <p><strong>Email:</strong> ${data.data.user.email}</p>
                            <p><strong>Role:</strong> ${data.data.user.role}</p>
                            <p><strong>Token:</strong> ${authToken.substring(0, 20)}...</p>
                        </div>
                    `;
                    updateStorageInfo();
                } else {
                    result.innerHTML = `<p style="color: #ef4444;">❌ Login failed: ${data.message}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p style="color: #ef4444;">❌ Error: ${error.message}</p>`;
            }
        }

        async function testCoordinatorAPI() {
            const result = document.getElementById('api-result');
            
            if (!authToken) {
                result.innerHTML = '<p style="color: #f59e0b;">⚠️ Please login first</p>';
                return;
            }

            result.innerHTML = '<p>Testing coordinator API...</p>';

            try {
                const response = await fetch('http://localhost:3002/api/coordinator/dashboard', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `
                        <div style="color: #10b981;">
                            <p>✅ Coordinator API working!</p>
                            <p><strong>Clubs:</strong> ${data.data.stats.total_clubs}</p>
                            <p><strong>Events:</strong> ${data.data.stats.total_events}</p>
                            <p><strong>Pending:</strong> ${data.data.stats.pending_events}</p>
                        </div>
                    `;
                } else {
                    result.innerHTML = `<p style="color: #ef4444;">❌ API error: ${data.message}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p style="color: #ef4444;">❌ Error: ${error.message}</p>`;
            }
        }

        // Initialize
        updateStorageInfo();
        
        // Auto-run backend check
        checkBackend();
    </script>
</body>
</html>
