<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beams Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }
        .test-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 2rem;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div id="beams-root"></div>
        <div class="content">
            <h1>Beams Background Test</h1>
            <p>If you can see animated light beams behind this text, the component is working!</p>
            <p>Navigate to: <a href="http://localhost:5173" style="color: #4fc3f7;">http://localhost:5173</a></p>
        </div>
    </div>

    <script>
        // Simple test to verify the frontend is accessible
        fetch('http://localhost:5173')
            .then(() => {
                console.log('Frontend is running on localhost:5173');
            })
            .catch(() => {
                console.log('Frontend might not be running. Start with: npm run dev');
            });
    </script>
</body>
</html>
